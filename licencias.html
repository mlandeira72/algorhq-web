<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALGOR · Gestión de Licencias</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #111827;
    --border: #1f2937;
    --navy: #0D1B4B;
    --cyan: #00C2D4;
    --cyan-dim: #00909c;
    --text: #f9fafb;
    --text-muted: #9ca3af;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --font-mono: 'JetBrains Mono', 'Fira Mono', monospace;
    --font: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  /* ── Auth overlay ── */
  #auth-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  #auth-overlay.hidden { display: none; }
  .auth-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 2rem; width: 360px;
  }
  .auth-box h2 { color: var(--cyan); font-size: 1.1rem; margin-bottom: 0.5rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .auth-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }

  /* ── Layout ── */
  header {
    background: var(--navy); border-bottom: 1px solid var(--border);
    padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem;
  }
  header h1 { font-size: 1rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cyan); }
  header span { color: var(--text-muted); font-size: 0.8rem; }
  main { max-width: 1100px; margin: 0 auto; padding: 2rem; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 0; margin-bottom: 2rem; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 0.75rem 1.5rem; cursor: pointer; font-size: 0.9rem;
    color: var(--text-muted); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s; background: none; border-top: none; border-left: none; border-right: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── Cards ── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem;
  }
  .card h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 1.25rem; }

  /* ── Forms ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  input, select {
    background: #1a2332; border: 1px solid var(--border); color: var(--text);
    padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.9rem; width: 100%;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--cyan); }
  input::placeholder { color: #4b5563; }

  /* ── Buttons ── */
  .btn {
    padding: 0.65rem 1.25rem; border-radius: 6px; font-size: 0.875rem;
    cursor: pointer; border: none; font-weight: 500; transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--cyan); color: #000; }
  .btn-danger { background: var(--red); color: #fff; font-size: 0.8rem; padding: 0.4rem 0.8rem; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }

  /* ── Result box ── */
  .result {
    margin-top: 1.25rem; padding: 1rem; border-radius: 6px;
    font-family: var(--font-mono); font-size: 0.85rem; display: none;
  }
  .result.ok { background: #052e16; border: 1px solid #166534; color: #86efac; display: block; }
  .result.err { background: #450a0a; border: 1px solid #991b1b; color: #fca5a5; display: block; }
  .clave-display {
    font-size: 1rem; letter-spacing: 0.05em; color: var(--cyan);
    background: #0a1628; padding: 0.75rem 1rem; border-radius: 4px;
    border: 1px solid var(--cyan-dim); margin-top: 0.5rem; word-break: break-all;
    cursor: pointer; position: relative;
  }
  .clave-display::after { content: 'Click para copiar'; font-size: 0.7rem; color: var(--text-muted); display: block; margin-top: 0.25rem; }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { padding: 0.6rem 0.75rem; text-align: left; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
  td { padding: 0.65rem 0.75rem; border-bottom: 1px solid #1a2332; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #111827; }
  .badge {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 9999px;
    font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .badge-green { background: #052e16; color: #86efac; border: 1px solid #166534; }
  .badge-yellow { background: #451a03; color: #fcd34d; border: 1px solid #92400e; }
  .mono { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-muted); }

  /* ── Misc ── */
  .loading { color: var(--text-muted); font-size: 0.85rem; padding: 2rem 0; text-align: center; }
  .empty { color: var(--text-muted); font-size: 0.85rem; padding: 3rem 0; text-align: center; }
  .toast {
    position: fixed; bottom: 1.5rem; right: 1.5rem;
    background: var(--surface); border: 1px solid var(--cyan);
    color: var(--text); padding: 0.75rem 1.25rem; border-radius: 8px;
    font-size: 0.85rem; opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .actions-row { display: flex; gap: 0.75rem; margin-top: 1.25rem; align-items: center; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; }
  .stat-val { font-size: 1.75rem; font-weight: 700; color: var(--cyan); }
  .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.2rem; }
</style>
</head>
<body>

<!-- Auth overlay -->
<div id="auth-overlay">
  <div class="auth-box">
    <h2>ALGOR · Licencias</h2>
    <p>Introduce tu API key de administrador para continuar.</p>
    <div class="form-group" style="margin-bottom:1rem">
      <label>API Key</label>
      <input type="password" id="api-key-input" placeholder="48790ee..." autocomplete="off">
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="autenticar()">Entrar</button>
    <div id="auth-error" style="color:var(--red);font-size:0.8rem;margin-top:0.75rem;display:none">API key incorrecta.</div>
  </div>
</div>

<header>
  <h1>ALGOR · Licencias</h1>
  <span>ComandaLocal — Panel de activación</span>
  <div style="margin-left:auto;display:flex;gap:0.75rem">
    <button class="btn btn-ghost" onclick="cargarLicencias()">↻ Actualizar</button>
    <button class="btn btn-ghost" onclick="cerrarSesion()">Salir</button>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab active" onclick="cambiarTab('generar', this)">Generar licencia</button>
    <button class="tab" onclick="cambiarTab('licencias', this)">Licencias activas</button>
  </div>

  <!-- Panel: Generar -->
  <div id="panel-generar" class="panel active">
    <div class="card">
      <h3>Nueva licencia</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>NIF del cliente</label>
          <input type="text" id="nif" placeholder="B12345678" maxlength="20">
        </div>
        <div class="form-group">
          <label>Nombre del local</label>
          <input type="text" id="nombre-local" placeholder="Restaurante El Rincón">
        </div>
        <div class="form-group">
          <label>Activaciones permitidas</label>
          <select id="max-activaciones">
            <option value="1">1 — instalación única</option>
            <option value="2">2 — permite un cambio de hardware</option>
            <option value="3">3</option>
          </select>
        </div>
      </div>
      <div class="actions-row">
        <button class="btn btn-primary" onclick="generarLicencia()">Generar clave</button>
        <button class="btn btn-ghost" onclick="limpiarFormulario()">Limpiar</button>
      </div>
      <div id="resultado-generar" class="result"></div>
    </div>
  </div>

  <!-- Panel: Licencias -->
  <div id="panel-licencias" class="panel">
    <div class="stats">
      <div class="stat"><div class="stat-val" id="stat-total">—</div><div class="stat-label">Total licencias</div></div>
      <div class="stat"><div class="stat-val" id="stat-activas">—</div><div class="stat-label">Activadas</div></div>
      <div class="stat"><div class="stat-val" id="stat-pendientes">—</div><div class="stat-label">Sin activar</div></div>
    </div>
    <div class="card">
      <h3>Todas las licencias</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Local / NIF</th>
              <th>Clave</th>
              <th>Estado</th>
              <th>Activaciones</th>
              <th>Activada</th>
              <th>Creada</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tabla-licencias">
            <tr><td colspan="7" class="loading">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const API = 'https://api.algorhq.app';
let apiKey = '';

// ── Auth ──────────────────────────────────────────────────────────────────────
async function autenticar() {
  const key = document.getElementById('api-key-input').value.trim();
  if (!key) return;
  // Verificamos con una llamada real
  const r = await fetch(`${API}/status`, { headers: { 'X-Api-Key': key } });
  if (r.ok) {
    apiKey = key;
    document.getElementById('auth-overlay').classList.add('hidden');
    cargarLicencias();
  } else {
    document.getElementById('auth-error').style.display = 'block';
  }
}

function cerrarSesion() {
  apiKey = '';
  document.getElementById('api-key-input').value = '';
  document.getElementById('auth-error').style.display = 'none';
  document.getElementById('auth-overlay').classList.remove('hidden');
}

document.getElementById('api-key-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') autenticar();
});

// ── Tabs ──────────────────────────────────────────────────────────────────────
function cambiarTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`panel-${id}`).classList.add('active');
  btn.classList.add('active');
  if (id === 'licencias') cargarLicencias();
}

// ── Generar licencia ──────────────────────────────────────────────────────────
async function generarLicencia() {
  const nif = document.getElementById('nif').value.trim().toUpperCase();
  const nombreLocal = document.getElementById('nombre-local').value.trim();
  const maxActivaciones = parseInt(document.getElementById('max-activaciones').value);
  const div = document.getElementById('resultado-generar');

  if (!nif || !nombreLocal) {
    div.className = 'result err';
    div.textContent = 'Rellena NIF y nombre del local.';
    return;
  }

  // Generar clave: CL-<random16hex>
  const random = Array.from(crypto.getRandomValues(new Uint8Array(8)))
    .map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
  const clave = `CL-${random}`;

  // Registrar en D1 via Worker
  const r = await fetch(`${API}/register`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Api-Key': apiKey },
    body: JSON.stringify({ clave, nif, nombre_local: nombreLocal, max_activaciones: maxActivaciones }),
  });

  const data = await r.json();
  if (!r.ok) {
    div.className = 'result err';
    div.textContent = `Error: ${data.error}`;
    return;
  }

  div.className = 'result ok';
  div.innerHTML = `
    <div style="margin-bottom:0.5rem">✓ Licencia creada para <strong>${nombreLocal}</strong> (${nif})</div>
    <div class="clave-display" onclick="copiar('${clave}', this)">${clave}</div>
  `;
}

function limpiarFormulario() {
  document.getElementById('nif').value = '';
  document.getElementById('nombre-local').value = '';
  document.getElementById('max-activaciones').value = '1';
  document.getElementById('resultado-generar').className = 'result';
}

// ── Cargar licencias ──────────────────────────────────────────────────────────
async function cargarLicencias() {
  if (!apiKey) return;
  const tbody = document.getElementById('tabla-licencias');
  tbody.innerHTML = '<tr><td colspan="7" class="loading">Cargando...</td></tr>';

  const r = await fetch(`${API}/status`, { headers: { 'X-Api-Key': apiKey } });
  const data = await r.json();

  document.getElementById('stat-total').textContent = data.total ?? '—';
  const activas = (data.licencias || []).filter(l => l.activada_en).length;
  document.getElementById('stat-activas').textContent = activas;
  document.getElementById('stat-pendientes').textContent = (data.total ?? 0) - activas;

  if (!data.licencias || data.licencias.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">Sin licencias todavía.</td></tr>';
    return;
  }

  tbody.innerHTML = data.licencias.map(l => {
    const activa = !!l.activada_en;
    const badge = activa
      ? '<span class="badge badge-green">Activa</span>'
      : '<span class="badge badge-yellow">Pendiente</span>';
    const activadaFecha = l.activada_en ? new Date(l.activada_en).toLocaleDateString('es-ES') : '—';
    const creadaFecha = new Date(l.creada_en).toLocaleDateString('es-ES');
    const fp = l.fingerprint ? `<span class="mono" title="${l.fingerprint}">${l.fingerprint.slice(0,12)}…</span>` : '<span class="mono">—</span>';
    return `<tr>
      <td><div style="font-weight:500">${esc(l.nombre_local)}</div><div class="mono">${esc(l.nif)}</div></td>
      <td><span class="mono" style="cursor:pointer;color:var(--cyan)" onclick="copiar('${esc(l.clave)}', this)" title="Click para copiar">${esc(l.clave)}</span></td>
      <td>${badge}</td>
      <td>${l.activaciones_usadas} / ${l.max_activaciones}</td>
      <td>${fp}<div style="font-size:0.75rem;color:var(--text-muted)">${activadaFecha}</div></td>
      <td class="mono">${creadaFecha}</td>
      <td>${activa ? `<button class="btn btn-danger" onclick="resetear('${esc(l.clave)}', '${esc(l.nombre_local)}')">Reset</button>` : ''}</td>
    </tr>`;
  }).join('');
}

// ── Resetear ──────────────────────────────────────────────────────────────────
async function resetear(clave, nombre) {
  if (!confirm(`¿Resetear la licencia de "${nombre}"?\n\nEl local deberá volver a activarse en la próxima instalación.`)) return;

  const r = await fetch(`${API}/reset`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Api-Key': apiKey },
    body: JSON.stringify({ clave }),
  });
  const data = await r.json();
  if (r.ok) {
    toast('Licencia reseteada correctamente');
    cargarLicencias();
  } else {
    toast(`Error: ${data.error}`, true);
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copiar(texto, el) {
  navigator.clipboard.writeText(texto).then(() => {
    toast('Copiado al portapapeles');
  });
}

function toast(msg, esError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = esError ? 'var(--red)' : 'var(--cyan)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
